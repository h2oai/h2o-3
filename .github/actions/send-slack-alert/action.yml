# =============================================================================
# Common Slack Alert for All Test Workflows
# =============================================================================
# Sends a Slack notification with test results table and failed job permalinks.
# Works for nightly tests (Smoke/Python/R/Java/Flow), JUnit tests (Java 8/11/17),
# and enterprise workflows.
#
# Features:
#   - Test results summary table with passed/failed/total counts
#   - Status indicators with emoji per test suite
#   - Failed jobs breakdown with direct permalink hyperlinks
#   - Scan mode detection (Nightly, Manual, Push)
#   - Workflow run link button
#
# Usage:
#   - uses: ./.github/actions/send-slack-alert
#     with:
#       pipeline: "H2O-3 Nightly Tests"
#       channel: "#h2o-3-alerts"
#       branch: "master"
#       build_result: "success"
#       overall_result: "failure"
#       test_results_json: '[{"name":"Smoke","result":"success","passed":8,"failed":0,"total":8}]'
#       failed_jobs_json: '[{"name": "Py3.7 Smoke", "url": "..."}]'
#       workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
#       slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
# =============================================================================

name: "Send Slack Alert"
description: "Send Slack notification with test results table and failed job permalink hyperlinks"

inputs:
  pipeline:
    description: "Pipeline name (e.g., H2O-3 Nightly Tests, H2O-3 JUnit Tests)"
    required: true

  channel:
    description: "Slack channel (e.g., #h2o-3-alerts)"
    required: true

  branch:
    description: "Branch tested"
    required: true

  build_sha:
    description: "Commit SHA"
    required: false
    default: ""

  build_result:
    description: "Build job result (success/failure/skipped)"
    required: true

  overall_result:
    description: "Overall test result (success/failure)"
    required: true

  test_results_json:
    description: 'JSON array of test suite results: [{"name":"Smoke","result":"success","passed":8,"failed":0,"total":8}]'
    required: true

  failed_jobs_json:
    description: "JSON array of failed jobs: [{name, url}]"
    required: false
    default: "[]"

  workflow-url:
    description: "URL to the workflow run"
    required: true

  slack-token:
    description: "Slack Bot Token"
    required: true

  event-name:
    description: "GitHub event name (schedule, workflow_dispatch)"
    required: false
    default: "workflow_dispatch"

  send-on-success:
    description: "Send notification when all tests pass"
    required: false
    default: "false"

  dry-run:
    description: "If true, build payload but don't send (for testing)"
    required: false
    default: "false"

outputs:
  sent:
    description: "Whether the notification was sent (true/false)"
    value: ${{ steps.finalize.outputs.sent }}

  status:
    description: "Overall status (PASS, FAIL)"
    value: ${{ steps.build.outputs.status }}

runs:
  using: "composite"
  steps:
    # =========================================================================
    # Step 1: Validate inputs
    # =========================================================================
    - name: Validate inputs
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        WORKFLOW_URL: ${{ inputs.workflow-url }}
      run: |
        ERRORS=0

        if [[ -z "${CHANNEL}" ]]; then
          echo "::error::Input 'channel' is required"
          ERRORS=$((ERRORS + 1))
        elif [[ ! "${CHANNEL}" =~ ^# ]]; then
          echo "::error::Input 'channel' must start with # (got: ${CHANNEL})"
          ERRORS=$((ERRORS + 1))
        fi

        if [[ -z "${WORKFLOW_URL}" ]]; then
          echo "::error::Input 'workflow-url' is required"
          ERRORS=$((ERRORS + 1))
        fi

        if [[ ${ERRORS} -gt 0 ]]; then
          echo "::error::Input validation failed with ${ERRORS} error(s)"
          exit 1
        fi

        echo "All inputs validated successfully"

    # =========================================================================
    # Step 2: Build Slack payload
    # =========================================================================
    - name: Build Slack payload
      id: build
      shell: bash
      env:
        PIPELINE: ${{ inputs.pipeline }}
        CHANNEL: ${{ inputs.channel }}
        BRANCH: ${{ inputs.branch }}
        BUILD_SHA: ${{ inputs.build_sha }}
        BUILD_RESULT: ${{ inputs.build_result }}
        OVERALL_RESULT: ${{ inputs.overall_result }}
        TEST_RESULTS_JSON: ${{ inputs.test_results_json }}
        FAILED_JOBS_JSON: ${{ inputs.failed_jobs_json }}
        WORKFLOW_URL: ${{ inputs.workflow-url }}
        EVENT_NAME: ${{ inputs.event-name }}
        SEND_ON_SUCCESS: ${{ inputs.send-on-success }}
      run: |
        python3 << 'PYTHON_SCRIPT'
        import json, os, sys
        from datetime import datetime, timezone

        STATUS_EMOJI = {
            "success": "✅",
            "failure": "❌",
            "skipped": "⏭️",
            "cancelled": "⚪",
        }

        def get_scan_mode(event_name):
            modes = {
                "schedule": "Nightly Schedule",
                "workflow_dispatch": "Manual Trigger",
                "push": "Push",
                "pull_request": "Pull Request",
            }
            return modes.get(event_name, event_name.title() if event_name else "Unknown")

        pipeline = os.environ["PIPELINE"]
        channel = os.environ["CHANNEL"]
        branch = os.environ["BRANCH"]
        build_sha = os.environ.get("BUILD_SHA", "")
        build_result = os.environ["BUILD_RESULT"]
        overall_result = os.environ["OVERALL_RESULT"]
        workflow_url = os.environ["WORKFLOW_URL"]
        event_name = os.environ.get("EVENT_NAME", "workflow_dispatch")
        send_on_success = os.environ.get("SEND_ON_SUCCESS", "false").lower() == "true"

        try:
            test_results = json.loads(os.environ.get("TEST_RESULTS_JSON", "[]"))
        except json.JSONDecodeError:
            test_results = []

        try:
            failed_jobs = json.loads(os.environ.get("FAILED_JOBS_JSON", "[]"))
        except json.JSONDecodeError:
            failed_jobs = []

        has_failure = overall_result == "failure" or build_result == "failure"
        overall_status = "FAIL" if has_failure else "PASS"

        should_send = True
        if not has_failure and not send_on_success:
            should_send = False
            print("All tests passed and send-on-success is false — skipping")

        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"status={overall_status}\n")
            f.write(f"should_send={str(should_send).lower()}\n")

        if not should_send:
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("payload_file=\n")
            sys.exit(0)

        scan_mode = get_scan_mode(event_name)
        scan_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

        if has_failure:
            header = f"🔴 {pipeline} — FAILED"
        else:
            header = f"✅ {pipeline} — PASSED"

        # ── Build blocks ──
        blocks = [
            {
                "type": "header",
                "text": {"type": "plain_text", "text": header}
            },
            {
                "type": "context",
                "elements": [
                    {"type": "mrkdwn", "text": f"{scan_mode}  |  {scan_date}"}
                ]
            },
        ]

        left_lines = [f"*Branch:* `{branch}`"]
        if build_sha:
            left_lines.append(f"*Commit:* <https://github.com/h2oai/h2o-3/commit/{build_sha}|{build_sha[:8]}>")

        right_lines = [
            "*Links:*",
            f"• <{workflow_url}|Workflow Run>",
        ]

        blocks.append({
            "type": "section",
            "fields": [
                {"type": "mrkdwn", "text": "\n".join(left_lines)},
                {"type": "mrkdwn", "text": "\n".join(right_lines)},
            ]
        })

        blocks.append({"type": "divider"})

        # ── Test Results Table ──
        blocks.append({
            "type": "section",
            "text": {"type": "mrkdwn", "text": "*Test Results Summary*"}
        })

        table_rows = [
            [
                {"type": "raw_text", "text": "Test Suite"},
                {"type": "raw_text", "text": "Status"},
                {"type": "raw_text", "text": "Passed"},
                {"type": "raw_text", "text": "Failed"},
                {"type": "raw_text", "text": "Total"},
            ]
        ]

        total_passed = 0
        total_failed = 0
        total_jobs = 0

        for suite in test_results:
            name = suite.get("name", "Unknown")
            result = suite.get("result", "skipped")
            passed = int(suite.get("passed", 0))
            failed = int(suite.get("failed", 0))
            total = passed + failed

            total_passed += passed
            total_failed += failed
            total_jobs += total

            status_emoji = STATUS_EMOJI.get(result, "❓")

            table_rows.append([
                {"type": "raw_text", "text": name},
                {"type": "raw_text", "text": status_emoji},
                {"type": "raw_text", "text": str(passed)},
                {"type": "raw_text", "text": str(failed)},
                {"type": "raw_text", "text": str(total)},
            ])

        overall_emoji = "❌" if has_failure else "✅"
        table_rows.append([
            {"type": "raw_text", "text": "Total"},
            {"type": "raw_text", "text": overall_emoji},
            {"type": "raw_text", "text": str(total_passed)},
            {"type": "raw_text", "text": str(total_failed)},
            {"type": "raw_text", "text": str(total_jobs)},
        ])

        blocks.append({
            "type": "table",
            "column_settings": [
                {"align": "left"},
                {"align": "center"},
                {"align": "center"},
                {"align": "center"},
                {"align": "center"},
            ],
            "rows": table_rows
        })

        # ── Failed Jobs with Permalinks ──
        if failed_jobs:
            blocks.append({"type": "divider"})
            blocks.append({
                "type": "section",
                "text": {"type": "mrkdwn", "text": f"*Failed Jobs ({len(failed_jobs)}):*"}
            })

            lines = []
            for job in failed_jobs:
                name = job.get("name", "Unknown")
                url = job.get("url", "")
                if url:
                    lines.append(f"• <{url}|{name}>")
                else:
                    lines.append(f"• {name}")

            chunk = []
            chunk_len = 0
            for line in lines:
                if chunk_len + len(line) + 1 > 2800:
                    blocks.append({
                        "type": "section",
                        "text": {"type": "mrkdwn", "text": "\n".join(chunk)}
                    })
                    chunk = []
                    chunk_len = 0
                chunk.append(line)
                chunk_len += len(line) + 1

            if chunk:
                blocks.append({
                    "type": "section",
                    "text": {"type": "mrkdwn", "text": "\n".join(chunk)}
                })

        blocks.append({
            "type": "context",
            "elements": [
                {"type": "mrkdwn", "text": f"{pipeline} | GitHub Actions"}
            ]
        })

        payload = {"text": header, "blocks": blocks}

        payload_file = "/tmp/slack_payload.json"
        with open(payload_file, "w") as f:
            json.dump(payload, f, indent=2)

        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"payload_file={payload_file}\n")

        print(f"\nSlack payload built:")
        print(f"  Pipeline: {pipeline}")
        print(f"  Status: {overall_status}")
        print(f"  Total Passed: {total_passed}")
        print(f"  Total Failed: {total_failed}")
        print(f"  Failed Jobs: {len(failed_jobs)}")
        PYTHON_SCRIPT

    # =========================================================================
    # Step 3: Send Slack notification
    # =========================================================================
    - name: Send Slack notification
      id: send
      if: steps.build.outputs.should_send == 'true' && inputs.dry-run != 'true'
      uses: slackapi/slack-github-action@v1.27.0
      with:
        channel-id: ${{ inputs.channel }}
        payload-file-path: ${{ steps.build.outputs.payload_file }}
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-token }}

    # =========================================================================
    # Step 4: Set final outputs
    # =========================================================================
    - name: Set final outputs
      id: finalize
      shell: bash
      run: |
        if [[ "${{ steps.build.outputs.should_send }}" == "true" && "${{ inputs.dry-run }}" != "true" ]]; then
          echo "sent=true" >> $GITHUB_OUTPUT
          echo "Slack notification sent successfully to ${{ inputs.channel }}"
        else
          echo "sent=false" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            echo "Dry run mode — notification not sent"
          else
            echo "Notification skipped based on configuration"
          fi
        fi
