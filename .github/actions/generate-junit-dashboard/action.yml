# ==============================================================================
#                         JUNIT TEST DASHBOARD GENERATOR
# ==============================================================================
#
# PURPOSE:
#   Generates a comprehensive JUnit test dashboard in GitHub Job Summary
#   with detailed individual job results, timing, and failure analysis.
#   Matches the nightly test dashboard style exactly.
#
# FEATURES:
#   - Individual job results per Java version (8, 11, 17)
#   - Shields.io status badges for color
#   - Permalink URLs to job summaries for failed tests
#   - Duration tracking per job
#   - Summary statistics
#
# USAGE:
#   - uses: ./.github/actions/generate-junit-dashboard
#     with:
#       github_token: ${{ secrets.GITHUB_TOKEN }}
#       branch: master
#       build_result: success
#       java8_result: success
#       java11_result: failure
#       java17_result: success
#
# ==============================================================================

name: 'Generate JUnit Test Dashboard'
description: 'Generate comprehensive JUnit test dashboard with individual job results'

inputs:
  github_token:
    description: 'GitHub token for API calls to fetch job details'
    required: true

  branch:
    description: 'H2O-3 branch tested'
    required: true

  build_sha:
    description: 'H2O-3 commit SHA'
    required: false
    default: ''

  build_result:
    description: 'Build job result'
    required: true

  java8_result:
    description: 'Java 8 JUnit tests result'
    required: false
    default: 'skipped'

  java11_result:
    description: 'Java 11 JUnit tests result'
    required: false
    default: 'skipped'

  java17_result:
    description: 'Java 17 JUnit tests result'
    required: false
    default: 'skipped'

outputs:
  java8_passed:
    description: 'Number of passed Java 8 jobs'
    value: ${{ steps.dashboard.outputs.java8_passed }}
  java8_failed:
    description: 'Number of failed Java 8 jobs'
    value: ${{ steps.dashboard.outputs.java8_failed }}
  java8_total:
    description: 'Total Java 8 jobs'
    value: ${{ steps.dashboard.outputs.java8_total }}
  java11_passed:
    description: 'Number of passed Java 11 jobs'
    value: ${{ steps.dashboard.outputs.java11_passed }}
  java11_failed:
    description: 'Number of failed Java 11 jobs'
    value: ${{ steps.dashboard.outputs.java11_failed }}
  java11_total:
    description: 'Total Java 11 jobs'
    value: ${{ steps.dashboard.outputs.java11_total }}
  java17_passed:
    description: 'Number of passed Java 17 jobs'
    value: ${{ steps.dashboard.outputs.java17_passed }}
  java17_failed:
    description: 'Number of failed Java 17 jobs'
    value: ${{ steps.dashboard.outputs.java17_failed }}
  java17_total:
    description: 'Total Java 17 jobs'
    value: ${{ steps.dashboard.outputs.java17_total }}
  failed_jobs_json:
    description: 'JSON array of failed jobs for Slack alerts'
    value: ${{ steps.dashboard.outputs.failed_jobs_json }}

runs:
  using: 'composite'
  steps:
    - name: Fetch Job Details
      id: fetch-jobs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "Fetching jobs for run ${{ github.run_id }}..."

        gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
          --paginate \
          --jq '.jobs[] | {id: .id, name: .name, status: .status, conclusion: .conclusion, started_at: .started_at, completed_at: .completed_at}' \
          > /tmp/jobs.json 2>/dev/null || echo "[]" > /tmp/jobs.json

        echo "Jobs fetched:"
        cat /tmp/jobs.json | head -50

    - name: Generate Dashboard
      id: dashboard
      shell: bash
      run: |
        # ==================================================
        # HELPER FUNCTIONS
        # ==================================================

        get_status_text() {
          case "$1" in
            success) echo "Success" ;;
            failure) echo "Failure" ;;
            skipped) echo "Skipped" ;;
            cancelled) echo "Cancelled" ;;
            in_progress) echo "Running" ;;
            *) echo "$1" ;;
          esac
        }

        # GitHub Step Summary strips inline style attributes, so we use shields.io badges for color
        get_status_badge() {
          case "$1" in
            success) echo '<img src="https://img.shields.io/badge/Success-brightgreen" alt="Success">' ;;
            failure) echo '<img src="https://img.shields.io/badge/Failure-red" alt="Failure">' ;;
            skipped) echo '<img src="https://img.shields.io/badge/Skipped-lightgrey" alt="Skipped">' ;;
            cancelled) echo '<img src="https://img.shields.io/badge/Cancelled-yellow" alt="Cancelled">' ;;
            in_progress) echo '<img src="https://img.shields.io/badge/Running-blue" alt="Running">' ;;
            *) echo "$1" ;;
          esac
        }

        calc_duration() {
          local start="$1"
          local end="$2"

          if [[ -z "$start" || -z "$end" || "$start" == "null" || "$end" == "null" ]]; then
            echo "-"
            return
          fi

          local start_sec=$(date -d "$start" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$start" +%s 2>/dev/null || echo "0")
          local end_sec=$(date -d "$end" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$end" +%s 2>/dev/null || echo "0")

          if [[ "$start_sec" == "0" || "$end_sec" == "0" ]]; then
            echo "-"
            return
          fi

          local diff=$((end_sec - start_sec))

          if [[ $diff -lt 60 ]]; then
            echo "${diff}s"
          elif [[ $diff -lt 3600 ]]; then
            local mins=$((diff / 60))
            local secs=$((diff % 60))
            echo "${mins}m ${secs}s"
          else
            local hours=$((diff / 3600))
            local mins=$(((diff % 3600) / 60))
            echo "${hours}h ${mins}m"
          fi
        }

        categorize_job() {
          local name="$1"

          # Skip infrastructure jobs
          if [[ "$name" =~ ^(Start|Stop|Initialize|Summary|Build) ]] || \
             [[ "$name" == "Test Dashboard" ]] || \
             [[ "$name" == "Final EC2 Cleanup" ]] || \
             [[ "$name" =~ "/ Start - " ]] || \
             [[ "$name" =~ "/ Stop - " ]] || \
             [[ "$name" =~ "/ Build" ]] || \
             [[ "$name" =~ "/ Summary" ]] || \
             [[ "$name" =~ "/ Cleanup" ]] || \
             [[ "$name" =~ "Cleanup Orphans" ]]; then
            echo "skip"
            return
          fi

          if [[ "$name" == "Java 8 JUnit /"* ]] || [[ "$name" =~ "Java 8" ]]; then
            echo "java8"
          elif [[ "$name" == "Java 11 JUnit /"* ]] || [[ "$name" =~ "Java 11" ]]; then
            echo "java11"
          elif [[ "$name" == "Java 17 JUnit /"* ]] || [[ "$name" =~ "Java 17" ]]; then
            echo "java17"
          else
            echo "other"
          fi
        }

        # ==================================================
        # PARSE JOB DATA
        # ==================================================

        declare -A java8_jobs java11_jobs java17_jobs
        declare -a failed_jobs

        java8_passed=0
        java8_failed=0
        java8_total=0
        java11_passed=0
        java11_failed=0
        java11_total=0
        java17_passed=0
        java17_failed=0
        java17_total=0

        FAILED_JOBS_JSON="["
        FIRST_FAILED=true

        while IFS= read -r line; do
          [[ -z "$line" ]] && continue

          name=$(echo "$line" | jq -r '.name // empty')
          [[ -z "$name" ]] && continue

          job_id=$(echo "$line" | jq -r '.id // ""')
          conclusion=$(echo "$line" | jq -r '.conclusion // "pending"')
          status=$(echo "$line" | jq -r '.status // "queued"')
          started=$(echo "$line" | jq -r '.started_at // ""')
          completed=$(echo "$line" | jq -r '.completed_at // ""')
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}#summary-${job_id}"

          result="$conclusion"
          [[ "$result" == "null" || -z "$result" ]] && result="$status"

          category=$(categorize_job "$name")
          [[ "$category" == "skip" || "$category" == "other" ]] && continue

          duration=$(calc_duration "$started" "$completed")
          status_text=$(get_status_text "$result")

          case "$category" in
            java8) category_name="Java 8" ;;
            java11) category_name="Java 11" ;;
            java17) category_name="Java 17" ;;
            *) category_name="Other" ;;
          esac

          job_entry="${status_text}|${name}|${duration}|${url}|${result}|${category_name}"

          case "$category" in
            java8)
              java8_jobs["$name"]="$job_entry"
              java8_total=$((java8_total + 1))
              [[ "$result" == "success" ]] && java8_passed=$((java8_passed + 1))
              [[ "$result" == "failure" ]] && java8_failed=$((java8_failed + 1))
              ;;
            java11)
              java11_jobs["$name"]="$job_entry"
              java11_total=$((java11_total + 1))
              [[ "$result" == "success" ]] && java11_passed=$((java11_passed + 1))
              [[ "$result" == "failure" ]] && java11_failed=$((java11_failed + 1))
              ;;
            java17)
              java17_jobs["$name"]="$job_entry"
              java17_total=$((java17_total + 1))
              [[ "$result" == "success" ]] && java17_passed=$((java17_passed + 1))
              [[ "$result" == "failure" ]] && java17_failed=$((java17_failed + 1))
              ;;
          esac

          if [[ "$result" == "failure" ]]; then
            failed_jobs+=("$job_entry")
            if [[ "$FIRST_FAILED" == "true" ]]; then
              FIRST_FAILED=false
            else
              FAILED_JOBS_JSON="${FAILED_JOBS_JSON},"
            fi
            escaped_name=$(echo "$name" | sed 's/"/\\"/g')
            FAILED_JOBS_JSON="${FAILED_JOBS_JSON}{\"name\":\"${escaped_name}\",\"url\":\"${url}\"}"
          fi

        done < /tmp/jobs.json

        FAILED_JOBS_JSON="${FAILED_JOBS_JSON}]"

        # Export outputs for Slack alerts
        echo "java8_passed=${java8_passed}" >> $GITHUB_OUTPUT
        echo "java8_failed=${java8_failed}" >> $GITHUB_OUTPUT
        echo "java8_total=${java8_total}" >> $GITHUB_OUTPUT
        echo "java11_passed=${java11_passed}" >> $GITHUB_OUTPUT
        echo "java11_failed=${java11_failed}" >> $GITHUB_OUTPUT
        echo "java11_total=${java11_total}" >> $GITHUB_OUTPUT
        echo "java17_passed=${java17_passed}" >> $GITHUB_OUTPUT
        echo "java17_failed=${java17_failed}" >> $GITHUB_OUTPUT
        echo "java17_total=${java17_total}" >> $GITHUB_OUTPUT
        echo "failed_jobs_json=${FAILED_JOBS_JSON}" >> $GITHUB_OUTPUT

        # ==================================================
        # CALCULATE OVERALL STATUS
        # ==================================================

        BUILD_RESULT="${{ inputs.build_result }}"
        JAVA8_RESULT="${{ inputs.java8_result }}"
        JAVA11_RESULT="${{ inputs.java11_result }}"
        JAVA17_RESULT="${{ inputs.java17_result }}"

        OVERALL="success"
        [[ "$BUILD_RESULT" == "failure" ]] && OVERALL="failure"
        [[ "$JAVA8_RESULT" == "failure" ]] && OVERALL="failure"
        [[ "$JAVA11_RESULT" == "failure" ]] && OVERALL="failure"
        [[ "$JAVA17_RESULT" == "failure" ]] && OVERALL="failure"

        total_failed=${#failed_jobs[@]}

        # ==================================================
        # GENERATE SUMMARY
        # ==================================================

        {
          echo "# H2O-3 JUnit Test Dashboard"
          echo ""

          if [[ "$OVERALL" == "success" ]]; then
            echo "> **All tests passed successfully!**"
          else
            echo "> **${total_failed} test(s) failed. See details below.**"
          fi
          echo ""

          # Build Information
          echo "## Build Information"
          echo ""
          echo "| Property | Value |"
          echo "|----------|-------|"
          echo "| **Branch** | \`${{ inputs.branch }}\` |"
          if [[ -n "${{ inputs.build_sha }}" ]]; then
            echo "| **Commit** | [\`${{ inputs.build_sha }}\`](https://github.com/h2oai/h2o-3/commit/${{ inputs.build_sha }}) |"
          fi
          echo "| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          echo "| **Triggered** | ${{ github.event_name }} |"
          echo "| **Build** | $(get_status_text "$BUILD_RESULT") |"
          echo ""

          # Test Results Section - HTML table with shields.io badges
          echo "## Test Results"
          echo ""
          echo "<table>"
          echo "<tr><th>Test Type</th><th>Test</th><th align=\"center\">Status</th><th>Duration</th></tr>"

          render_jobs() {
            local category="$1"
            local result="$2"
            shift 2
            local -n jobs_ref=$1

            if [[ "$result" == "skipped" ]]; then
              echo "<tr><td>${category}</td><td><em>Skipped</em></td><td align=\"center\">$(get_status_badge skipped)</td><td>-</td></tr>"
              return
            fi

            if [[ ${#jobs_ref[@]} -eq 0 ]]; then
              echo "<tr><td>${category}</td><td><em>No jobs found</em></td><td align=\"center\">-</td><td>-</td></tr>"
              return
            fi

            for name in "${!jobs_ref[@]}"; do
              IFS='|' read -r j_status_text j_name j_duration j_url j_result j_category <<< "${jobs_ref[$name]}"
              if [[ "$j_result" == "failure" && -n "$j_url" && "$j_url" != "null" ]]; then
                echo "<tr><td>${category}</td><td><a href=\"${j_url}\">${j_name}</a></td><td align=\"center\">$(get_status_badge "$j_result")</td><td>${j_duration}</td></tr>"
              else
                echo "<tr><td>${category}</td><td>${j_name}</td><td align=\"center\">$(get_status_badge "$j_result")</td><td>${j_duration}</td></tr>"
              fi
            done
          }

          render_jobs "Java 8" "$JAVA8_RESULT" java8_jobs
          render_jobs "Java 11" "$JAVA11_RESULT" java11_jobs
          render_jobs "Java 17" "$JAVA17_RESULT" java17_jobs

          echo "</table>"
          echo ""

          # Failed Jobs Section
          if [[ ${#failed_jobs[@]} -gt 0 ]]; then
            echo "## Failed Jobs (${#failed_jobs[@]})"
            echo ""
            echo "<table>"
            echo "<tr><th>Test Type</th><th>Test</th><th align=\"center\">Status</th><th>Duration</th></tr>"
            for entry in "${failed_jobs[@]}"; do
              IFS='|' read -r status_text name duration url result category <<< "$entry"
              if [[ -n "$url" && "$url" != "null" ]]; then
                echo "<tr><td>${category:-Unknown}</td><td><a href=\"${url}\">${name}</a></td><td align=\"center\">$(get_status_badge failure)</td><td>${duration}</td></tr>"
              else
                echo "<tr><td>${category:-Unknown}</td><td>${name}</td><td align=\"center\">$(get_status_badge failure)</td><td>${duration}</td></tr>"
              fi
            done
            echo "</table>"
            echo ""
          fi

          # Summary Statistics
          echo "## Summary Statistics"
          echo ""
          echo "<table>"
          echo "<tr><th>Category</th><th align=\"center\">Status</th><th align=\"center\">Passed</th><th align=\"center\">Failed</th></tr>"

          render_summary_row() {
            local cat_name="$1"
            local cat_result="$2"
            local cat_passed="$3"
            local cat_failed="$4"
            echo "<tr><td>${cat_name}</td><td align=\"center\">$(get_status_badge "$cat_result")</td><td align=\"center\">${cat_passed}</td><td align=\"center\">${cat_failed}</td></tr>"
          }

          render_summary_row "Java 8 Tests" "$JAVA8_RESULT" "${java8_passed}" "${java8_failed}"
          render_summary_row "Java 11 Tests" "$JAVA11_RESULT" "${java11_passed}" "${java11_failed}"
          render_summary_row "Java 17 Tests" "$JAVA17_RESULT" "${java17_passed}" "${java17_failed}"

          echo "</table>"
          echo ""

        } >> $GITHUB_STEP_SUMMARY
