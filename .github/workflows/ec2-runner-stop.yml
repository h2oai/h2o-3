# ==============================================================================
#                         EC2 RUNNER STOP
# ==============================================================================
#
# PURPOSE:
#   Reusable workflow to stop an EC2 self-hosted runner.
#   Gracefully handles cases where no instance was started.
#
# ==============================================================================

name: Stop EC2 Runner

on:
  workflow_call:
    inputs:
      label:
        description: 'Runner label from ec2-runner-start'
        required: true
        type: string

      ec2_id:
        description: 'EC2 instance ID from ec2-runner-start'
        required: true
        type: string

    secrets:
      GH_APP_ID:
        description: 'GitHub App ID'
        required: true
      GH_APP_PRIVATE_KEY:
        description: 'GitHub App Private Key'
        required: true
      GH_APP_INSTALLATION_ID:
        description: 'GitHub App Installation ID'
        required: true

env:
  AWS_REGION: us-east-1
  EC2_ROLE: arn:aws:iam::041740254655:role/GitHub-OIDC-Role

jobs:
  stop:
    name: Stop EC2
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: inputs.label != '' && inputs.ec2_id != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure AWS
        if: inputs.label != '' && inputs.ec2_id != ''
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ env.EC2_ROLE }}
          role-session-name: ec2-stop-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Stop EC2 Runner
        if: inputs.label != '' && inputs.ec2_id != ''
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ inputs.label }}
          ec2-instance-id: ${{ inputs.ec2_id }}

      - name: Skip Notice
        if: inputs.label == '' || inputs.ec2_id == ''
        run: echo "Skipping EC2 stop - no instance was started (label='${{ inputs.label }}', ec2_id='${{ inputs.ec2_id }}')"
