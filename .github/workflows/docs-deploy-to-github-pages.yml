name: Deploy documentation to GitHub Pages

# Builds the Makersaurus docs site in documentation/ and publishes it to the
# gh-pages branch. Manual trigger only (matches the H2O docs-repo convention).
#
# @h2oai/makersaurus is published to the public npm registry, so no registry
# auth is needed. (Do NOT point npm at GitHub Packages — the 0.12.x line is only
# on public npm, so npm.pkg.github.com resolution fails with ETARGET.)
#
# PREREQUISITES for the site to be fully functional:
#   1. The Algolia facet "h2o-3-enterprise" (searchFilter in makersaurus.config.js)
#      must be registered in the central dev_docs_omnisearch crawler, or search
#      will return nothing.
#   2. The docs.h2o.ai hub must mount the baseUrl path (/h2o-3-enterprise/).
#
# NOTE: We use `npm install` (not `npm ci` / --frozen-lockfile) because no
# package-lock.json is committed yet (the local lockfile resolves makersaurus to
# a local checkout). Commit a registry-based lockfile and switch to `npm ci` for
# reproducible builds once one can be generated cleanly.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: cd documentation && npm install
      - name: Build docs
        run: cd documentation && npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./documentation/tmp/build
          user_name: shaunyogeshwaran
          user_email: shaun.yogeshwaran@h2o.ai
